name: CI - Health Tracking Platform

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend tests and Docker build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: health_db
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 4000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: health_db
      TEST_DB_NAME: health_db
      JWT_SECRET: test_jwt_secret
      JWT_EXPIRES_IN: 1h

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uapp -papp --silent && break
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Import database schema
        run: mysql -h 127.0.0.1 -uapp -papp health_db < ../database/schema.sql

      - name: Run backend tests
        run: npm test

      - name: Build backend Docker image
        run: docker build -t health-tracking-backend:ci .

  frontend:
    name: Frontend build and Docker build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      CI: false
      REACT_APP_API_URL: http://localhost:4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build frontend Docker image
        run: docker build -t health-tracking-frontend:ci .